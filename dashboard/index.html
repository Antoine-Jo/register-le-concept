<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; connect-src 'self' %VITE_CONNECT_SOURCES%; font-src 'self'; form-action 'self'; frame-src 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#0b1110">
    <title>Inscriptions · Le Concept</title>
    <link rel="stylesheet" href="../admin.css">
    <script type="module" src="../src/dashboard.js"></script>
  </head>
  <body class="admin-page dashboard-page">
    <header class="admin-header">
      <a class="admin-brand" href="../" aria-label="Retour au site Le Concept">
        <img src="../assets/logo.jpg" alt="Le Concept, esthétique et coiffure">
      </a>
      <button class="logout-button" id="logout-button" type="button">Se déconnecter</button>
    </header>

    <main class="dashboard-shell">
      <div class="dashboard-title">
        <div>
          <p class="admin-eyebrow">Soirée du 25 septembre 2026</p>
          <h1>Les inscrits</h1>
        </div>
        <p>Consultation uniquement</p>
      </div>

      <section class="summary-grid" aria-label="Résumé des inscriptions">
        <article>
          <span id="registration-count">—</span>
          <p>Inscriptions</p>
        </article>
        <article>
          <span id="participant-count">—</span>
          <p>Participants</p>
        </article>
      </section>

      <section class="registration-panel" aria-labelledby="list-title">
        <div class="panel-heading">
          <h2 id="list-title">Liste complète</h2>
          <p class="admin-status" id="dashboard-status" role="status" aria-live="polite"></p>
        </div>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Invité</th>
                <th scope="col">Personnes</th>
                <th scope="col">Inscription</th>
              </tr>
            </thead>
            <tbody id="registration-list"></tbody>
          </table>
        </div>

        <p class="empty-state" id="empty-state" hidden>Aucune inscription pour le moment.</p>
        <button class="load-more" id="load-more" type="button" hidden>Voir plus</button>
      </section>
    </main>
  </body>
</html>
