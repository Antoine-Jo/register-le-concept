<!doctype html>
<html lang="fr">
  <body style="background:#0b1110;color:#f1eadc;font-family:Arial,sans-serif;margin:0;padding:32px">
    <div style="margin:0 auto;max-width:520px">
      <p style="color:#e2c98d;font-size:12px;letter-spacing:2px;text-transform:uppercase">
        Espace privé Le Concept
      </p>
      <h1 style="font-size:32px;font-weight:400">Votre lien de connexion</h1>
      <p style="color:#afa99d;line-height:1.7">
        Ce lien est personnel, utilisable une seule fois et expire dans 10 minutes.
      </p>
      <p style="margin:32px 0">
        <a
          href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email"
          style="background:#c8a45d;color:#0b1110;display:inline-block;font-size:12px;font-weight:600;letter-spacing:1px;padding:18px 24px;text-decoration:none;text-transform:uppercase"
        >Accéder au dashboard</a>
      </p>
      <p style="color:#afa99d;font-size:12px;line-height:1.6">
        Si vous n’avez pas demandé ce lien, ignorez cet e-mail.
      </p>
    </div>
  </body>
</html>
